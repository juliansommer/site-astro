version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Sydney
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "solid-icons"
      - dependency-name: "typescript"
    groups:
      npm-dependencies:
        patterns:
          - "*"
